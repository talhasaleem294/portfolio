<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6c63ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer rounded square -->
  <rect x="4" y="4" width="112" height="112" rx="26" ry="26" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- Inner subtle darker layer for depth -->
  <rect x="10" y="10" width="100" height="100" rx="20" ry="20" fill="url(#grad2)" opacity="0.5"/>

  <!-- Top-left bracket accent -->
  <path d="M18 30 L18 18 L30 18" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Bottom-right bracket accent -->
  <path d="M102 90 L102 102 L90 102" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- T letter -->
  <text x="22" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="52" fill="white" letter-spacing="-2">T</text>

  <!-- S letter -->
  <text x="62" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="52" fill="rgba(255,255,255,0.85)" letter-spacing="-2">S</text>

  <!-- Dot accent below -->
  <circle cx="60" cy="97" r="3.5" fill="rgba(255,255,255,0.5)"/>
</svg>
